<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Super Segurança Bros</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
        body {
            background-color: #000;
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            position: fixed;
        }
        #game-wrapper {
            position: relative;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(to bottom, #5c94fc 0%, #9fc5ff 100%);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        canvas { display: block; width: 100%; height: 100%; object-fit: cover; flex-grow: 1; image-rendering: pixelated; }
        .overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.92);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-y: auto;
            padding: 20px;
            text-align: center;
            z-index: 10;
        }
