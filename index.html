<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafio do Casual - Mini Jogo</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #1e1e2f, #2a2a40);
            color: #fff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            touch-action: manipulation;
        }
        h1 {
            margin: 10px 0;
            font-size: 1.5rem;
            color: #00ffcc;
            text-align: center;
        }
        #game-container {
            width: 90vw;
            max-width: 400px;
            height: 60vh;
            background: #151522;
            border: 3px solid #00ffcc;
            border-radius: 12px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(0, 255, 204, 0.3);
        }
        .target {
            width: 50px;
            height: 50px;
            background: #ff007f;
            border-radius: 50%;
            position: absolute;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            box-shadow: 0 0 10px #ff007f;
            user-select: none;
            transition: transform 0.1s;
        }
        .target:active {
            transform: scale(0.9);
        }
        .scoreboard {
            display: flex;
            justify-content: space-between;
            width: 90vw;
            max-width: 400px;
            margin-bottom: 10px;
            font-size: 1.1rem;
            font-weight: bold;
        }
        #start-btn {
            margin-top: 15px;
            padding: 12px 25px;
            background: #00ffcc;
            color: #111;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,255,204,0.4);
        }
        #start-btn:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>

    <h1>🎮 Desafio do Casual</h1>
    <div class="scoreboard">
        <span>Pontos: <span id="score">0</span></span>
        <span>Tempo: <span id="timer">30</span>s</span>
    </div>

    <div id="game-container"></div>

    <button id="start-btn" onclick="startGame()">Iniciar Jogo</button>

    <script>
        const gameContainer = document.getElementById('game-container');
        const scoreDisplay = document.getElementById('score');
        const timerDisplay = document.getElementById('timer');
        const startBtn = document.getElementById('start-btn');

        let score = 0;
        let timeLeft = 30;
        let gameInterval = null;
        let targetInterval = null;

        function startGame() {
            gameContainer.innerHTML = '';
            score = 0;
            timeLeft = 30;
            scoreDisplay.textContent = score;
            timerDisplay.textContent = timeLeft;
            startBtn.style.display = 'none';

            gameInterval = setInterval(() => {
                timeLeft--;
                timerDisplay.textContent = timeLeft;
                if (timeLeft <= 0) {
                    endGame();
                }
            }, 1000);

            targetInterval = setInterval(spawnTarget, 800);
        }

        function spawnTarget() {
            if (timeLeft <= 0) return;

            const target = document.createElement('div');
            target.classList.add('target');
            target.innerHTML = '⭐';

            const maxX = gameContainer.clientWidth - 50;
            const maxY = gameContainer.clientHeight - 50;
            const randomX = Math.floor(Math.random() * maxX);
            const randomY = Math.floor(Math.random() * maxY);

            target.style.left = randomX + 'px';
            target.style.top = randomY + 'px';

            target.addEventListener('click', () => {
                score += 10;
                scoreDisplay.textContent = score;
                target.remove();
            });

            target.addEventListener('touchstart', (e) => {
                e.preventDefault();
                score += 10;
                scoreDisplay.textContent = score;
                target.remove();
            });

            gameContainer.appendChild(target);

            setTimeout(() => {
                if (target.parentElement) {
                    target.remove();
                }
            }, 1200);
        }

        function endGame() {
            clearInterval(gameInterval);
            clearInterval(targetInterval);
            gameContainer.innerHTML = `<div style="display:flex; align-items:center; justify-content:center; height:100%; flex-direction:column; text-align:center;">
                <h2>Fim de Jogo! 🏆</h2>
                <p style="font-size: 1.2rem; margin: 10px 0;">Sua pontuação: <strong>${score}</strong></p>
            </div>`;
            startBtn.style.display = 'block';
            startBtn.textContent = 'Jogar Novamente';
        }
    </script>
</body>
</html>
